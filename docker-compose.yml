name: linecore

services:

  postgres:
    image: postgres:17-alpine
    container_name: linecore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linecore}
      POSTGRES_USER: ${POSTGRES_USER:-linecore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linecore}
      # Deterministic collation, so ordering does not drift between dev and CI.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linecore} -d ${POSTGRES_DB:-linecore}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: linecore-rabbitmq
    restart: unless-stopped
    hostname: linecore-rabbitmq   # pinned: RabbitMQ keys its data directory off the hostname
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-linecore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-linecore}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"     # AMQP — Oee.Ingestion
      - "${RABBITMQ_MQTT_PORT:-1883}:1883"     # MQTT — Oee.Simulator
      - "${RABBITMQ_UI_PORT:-15672}:15672"     # management UI
      - "${RABBITMQ_METRICS_PORT:-15692}:15692" # prometheus metrics
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-linecore.conf:ro
    healthcheck:
      # check_port_connectivity covers the MQTT listener too, which a plain ping does not.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: linecore-redis
    restart: unless-stopped
    # Live machine state is derived data — it can always be rebuilt from Postgres, so
    # persistence buys nothing here and appendonly would just add write latency.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
