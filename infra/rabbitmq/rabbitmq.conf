# MQTT ingress ---------------------------------------------------------------
# The simulator speaks MQTT; everything downstream speaks AMQP. The plugin bridges
# the two by republishing MQTT messages into a topic exchange, which is what lets
# Oee.Ingestion consume them as ordinary AMQP messages.

mqtt.listeners.tcp.default = 1883

# The simulator is not a real device and has no credentials of its own.
mqtt.allow_anonymous  = false
mqtt.vhost            = /
mqtt.exchange         = amq.topic

# Signals are worthless once they are stale — a dashboard showing a five-minute-old
# machine state is worse than one showing nothing. A short session expiry keeps the
# broker from replaying history nobody wants.
#
# Note: this key replaced `mqtt.subscription_ttl`, which was deprecated in 3.13 and
# removed in 4.0. An unrecognised key here stops the broker booting at all.
mqtt.max_session_expiry_interval_seconds = 60
mqtt.prefetch                            = 100

# Management & metrics --------------------------------------------------------
management.tcp.port = 15672

# Resource limits -------------------------------------------------------------
# Keep the dev broker from eating the whole machine.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute          = 1GB
